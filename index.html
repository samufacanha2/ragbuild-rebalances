    <link rel="apple-touch-icon" href="%BASE_URL%ro-skills-icon-192.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <link rel="canonical" href="https://roskills.cc/" />
    <link rel="sitemap" type="application/xml" href="%BASE_URL%sitemap.xml" />

    <meta name="application-name" content="RO Skills" />
    <meta name="description" content="RO Skills is a Ragnarok Online skill tree planner for checking prerequisites, allocating class points, and comparing ROLATAM rebalance notes." />
    <meta name="theme-color" content="#615f86" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large" />
    <meta name="bingbot" content="index, follow, max-snippet:-1, max-image-preview:large" />
    <script>
      (() => {
        try {
          const storedTheme = window.localStorage.getItem('ro-skills-theme')
          const theme = storedTheme === 'light' || storedTheme === 'dark'
            ? storedTheme
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')

          document.documentElement.dataset.theme = theme
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#1a1a25' : '#615f86')
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <script type="application/ld+json" id="app-structured-data">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "RO Skills",
        "url": "https://roskills.cc/",
        "description": "Ragnarok Online skill tree planner with class prerequisites, point allocation, and ROLATAM rebalance notes.",
        "applicationCategory": "GameApplication",
        "isAccessibleForFree": true,
        "keywords": "Ragnarok Online, RO, skill tree, skill planner, ROLATAM, rebalance",
        "operatingSystem": "Any",
        "inLanguage": ["en", "pt-BR"],
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
